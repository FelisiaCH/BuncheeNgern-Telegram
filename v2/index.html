<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuncheeNgern v2 — skeleton (Phase 0, not in use)</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
</head>
<body>

<!--
  Phase 0 skeleton per bcn-v2-system-design.md. Not linked from v1, not
  registered with any service worker, not in service-worker.js's ASSETS —
  this file is unreachable to real users unless they type the URL directly.
  v1 (the real, deployed app) is completely untouched by anything in v2/.

  Only what Phase 0's row in §10 calls for exists here: skeleton project,
  tokens, base CSS, store, api, i18n port. Screens (entry/dashboard/settings),
  the sidebar layout, charts, the accent-preset picker and Thai/Lao type
  tuning are Phase 1–3 and are NOT built yet — each needs its own concrete,
  reviewed spec before code gets written, same as every other change this
  session. See v2/README.md.
-->

<div style="padding:32px;max-width:480px;margin:0 auto">
  <h1 style="font-size:20px;font-weight:800;margin-bottom:8px">BuncheeNgern v2 — Phase 0 skeleton</h1>
  <p style="color:var(--txt-sub);font-size:13px;line-height:1.6;margin-bottom:20px">
    Not the live app. This page exists to prove tokens.css, base.css, store.js,
    api.js and i18n.js load and wire together. Nothing here is user-facing.
  </p>
  <div id="check" style="background:var(--bg-card);border:1px solid var(--brd);border-radius:var(--r);padding:16px;font-size:13px;line-height:1.9"></div>
</div>

<!-- i18n data — reused unchanged from v1, per §2. Not duplicated into v2/. -->
<script src="../i18n/lang_meta.js"></script>
<script src="../i18n/lang_en.js"></script>
<script src="../i18n/lang_th.js"></script>
<script src="../i18n/build.js"></script>

<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script>
// ⚙️ Configuration — stays inline per CLAUDE.md. Placeholder until this
// screen does something that needs a real request; not wired to a live
// endpoint in Phase 0.
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID_HERE";
const SCRIPT_URL       = "YOUR_APPS_SCRIPT_URL_HERE";
</script>
<script src="js/api.js"></script>
<script>
  initLang();
  store.subscribe(() => applyTranslationsToDom());
  applyTranslationsToDom();

  const state = store.get();
  document.getElementById('check').innerHTML = [
    `store.get().lang → <b>${state.lang}</b>`,
    `t('tagline') → <b>${t('tagline') || '(empty — I18N did not load)'}</b>`,
    `typeof store.set → <b>${typeof store.set}</b>`,
    `typeof apiGet → <b>${typeof apiGet}</b>`,
    `typeof apiPost → <b>${typeof apiPost}</b>`,
    `SCRIPT_URL configured → <b>${SCRIPT_URL !== 'YOUR_APPS_SCRIPT_URL_HERE'}</b>`,
  ].map(l => `<div>${l}</div>`).join('');
</script>
</body>
</html>
